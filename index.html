<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF0F2">
<link rel="manifest" href="manifest.json">
<title>Meu fluxo de caixa</title>
<style>
  :root{
    --bg:#FBEFF3;
    --surface:#FFFFFF;
    --border:#F0D6E0;
    --ink:#5C2A44;
    --ink-soft:#9C7186;
    --income:#D6487A;
    --income-bg:#FBE3EC;
    --expense:#8B3A5E;
    --expense-bg:#F2DCE6;
    --invest:#7A4C7E;
    --invest-bg:#ECE0EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height:1.4;
  }
  #app{ max-width:900px; margin:0 auto; padding:28px 20px 60px; }

  /* Cabeçalho */
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:22px;
    flex-wrap:wrap; gap:10px;
  }
  .masthead h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size:30px; font-weight:normal; margin:0;
  }
  .month-nav{ display:flex; align-items:center; gap:10px; font-family:Georgia, serif; font-size:17px; }
  .month-nav button{
    background:none; border:1px solid var(--ink); color:var(--ink);
    width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1;
  }
  .month-nav button:hover{ background:var(--ink); color:var(--bg); }
  .month-label{ min-width:150px; text-align:center; text-transform:capitalize; }

  /* Resumo */
  .summary{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:14px; margin-bottom:26px;
  }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:14px 16px; }
  .stat .label{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .stat .value{ font-family:Georgia, serif; font-size:24px; font-variant-numeric:tabular-nums; }
  .stat.income .value{ color:var(--income); }
  .stat.expense .value{ color:var(--expense); }
  .stat.balance .value{ font-weight:bold; }
  .stat.invest .value{ color:var(--invest); }
  .stat .sub{ font-size:11px; color:var(--ink-soft); margin-top:4px; }

  .layout{ display:grid; grid-template-columns:300px 1fr; gap:20px; }
  @media (max-width:680px){ .layout{ grid-template-columns:1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:18px; }
  .panel h2{
    font-family:Georgia, serif; font-size:16px; font-weight:normal;
    margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--border);
  }

  /* Abas */
  .tabs{ display:flex; gap:18px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab-btn{
    background:none; border:none; padding:6px 2px 10px; font-size:14px;
    color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--income); font-weight:600; }

  /* Formulário */
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select{
    width:100%; padding:10px 9px; border:1px solid var(--border); border-radius:4px;
    font-size:16px; font-family:inherit; color:var(--ink); background:#fff;
  }
  .toggle{ display:flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:14px; }
  .toggle button{ flex:1; padding:8px; border:none; background:#fff; cursor:pointer; font-size:13px; color:var(--ink-soft); }
  .toggle button.active.type-income{ background:var(--income-bg); color:var(--income); font-weight:600; }
  .toggle button.active.type-expense{ background:var(--expense-bg); color:var(--expense); font-weight:600; }

  .add-btn{
    width:100%; padding:10px; background:var(--income); color:#fff;
    border:none; border-radius:4px; font-size:14px; cursor:pointer; margin-top:4px;
  }
  .add-btn:hover{ background:#b93a66; }
  .add-btn:disabled{ opacity:.6; cursor:default; }

  /* Lista */
  .tx-row{
    display:grid; grid-template-columns:62px 1fr auto 28px; gap:10px;
    align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px;
  }
  .tx-row:last-child{ border-bottom:none; }
  .tx-date{ color:var(--ink-soft); font-size:12px; }
  .tx-info{ display:flex; flex-direction:column; gap:3px; }
  .tx-cat{
    display:inline-block; width:fit-content; font-size:11px; color:var(--ink-soft);
    border:1px solid var(--border); border-radius:10px; padding:1px 8px;
  }
  .tx-desc{ font-size:14px; }
  .tx-amount{ font-variant-numeric:tabular-nums; font-weight:600; text-align:right; }
  .tx-amount.income{ color:var(--income); }
  .tx-amount.expense{ color:var(--expense); }
  .tx-del{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; }
  .tx-del:hover{ color:var(--expense); }

  /* Gráfico */
  .pie-wrap{ display:flex; align-items:center; gap:28px; flex-wrap:wrap; padding:6px 0 4px; }
  .pie-wrap svg{ flex-shrink:0; }
  .pie-legend{ flex:1; min-width:180px; }
  .legend-row{
    display:flex; align-items:center; gap:8px; font-size:13px;
    padding:5px 0; border-bottom:1px solid var(--border);
  }
  .legend-row:last-child{ border-bottom:none; }
  .swatch{ width:10px; height:10px; border-radius:2px; flex-shrink:0; }
  .legend-label{ flex:1; }
  .legend-val{ color:var(--ink-soft); font-variant-numeric:tabular-nums; }

  .empty{ text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:14px; }

  /* Rodapé / backup */
  .backup-bar{ display:flex; justify-content:center; gap:12px; margin-top:22px; flex-wrap:wrap; }
  .backup-btn{
    font-size:12px; padding:7px 16px; border:1px solid var(--border); border-radius:20px;
    background:var(--surface); color:var(--ink-soft); cursor:pointer; display:inline-block;
  }
  .backup-btn:hover{ border-color:var(--income); color:var(--income); }
  .save-note{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:18px; }
  .logout-btn{ background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline; }

  /* Login */
  .login-box{
    max-width:380px; margin:60px auto; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; padding:28px; text-align:center;
  }
  @media (max-width:480px){
    .login-box{ margin:24px auto; padding:22px 18px; }
  }
  .login-box h1{ font-family:Georgia, serif; font-weight:normal; font-size:26px; margin:0 0 6px; }
  .login-box p{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
  .login-box input{
    width:100%; padding:12px; border:1px solid var(--border); border-radius:4px;
    font-size:16px; font-family:inherit; margin-bottom:12px;
  }
  .login-switch{ font-size:13px; color:var(--ink-soft); margin-top:16px; }
  .login-switch button{
    background:none; border:none; color:var(--income); cursor:pointer;
    font-size:13px; text-decoration:underline; padding:0;
  }
  .login-forgot{ text-align:right; margin:-6px 0 12px; }
  .login-forgot button{
    background:none; border:none; color:var(--ink-soft); cursor:pointer;
    font-size:12px; text-decoration:underline; padding:0;
  }
  .status-msg{ font-size:12px; color:var(--income); margin-top:12px; }
  .status-msg.erro{ color:var(--expense); }

  /* Erro visível */
  .fatal{
    max-width:600px; margin:40px auto; background:#fff; border:1px solid var(--expense);
    border-left:5px solid var(--expense); border-radius:6px; padding:20px;
    font-size:13px; color:var(--expense);
  }
  .fatal code{ display:block; margin-top:10px; background:#F8F0F3; padding:10px; border-radius:4px;
    word-break:break-all; color:var(--ink); font-size:12px; }
</style>
</head>
<body>
<div id="app"><div class="empty">Carregando...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   CONFIGURAÇÃO DO SUPABASE
   ========================================================== */
const SUPABASE_URL = 'https://uigxkiyovqiggrrfxmsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g9TUPVNhsbjhPDDHWku1bQ_qI2vTqqH';
/* ========================================================== */

const CATS = {
  entrada: ['Saldo inicial (conta)','Saldo inicial (investimento)','Salário','Resgate','Outras entradas'],
  saida: ['Alimentação','Saúde','Lazer','Educação','Outros gastos','Luz','Água',
          'Internet','Celular','Cartão de crédito','Farmácia','Pets','Aplicação','IPTU','CRC',
          'Academia','Uber','Casa']
};

const PIE_COLORS = ['#D6487A','#8B3A5E','#C2698D','#7A4C7E','#E27BA0','#A2456B',
                    '#B85C82','#6E3350','#D98CAE','#9C5470','#C44E74','#7E3D5C'];

const CACHE_KEY = 'fluxo-caixa-cache';

let sb = null;
let state = {
  txs: [], session: null,
  authMode: 'login',           // 'login' | 'signup' | 'recovery'
  email: '', password: '', password2: '',
  statusMsg: '', statusErro: false,
  busy: false, loaded: false, monthOffset: 0, tab: 'lista',
  form: { type:'saida', date: hoje(), desc:'', category: CATS.saida[0], amount:'' }
};

/* ---------- Erro visível em vez de tela branca ---------- */
function telaDeErro(titulo, detalhe){
  document.getElementById('app').innerHTML =
    `<div class="fatal"><strong>${titulo}</strong><code>${detalhe}</code></div>`;
}
window.addEventListener('error', e => {
  telaDeErro('Ocorreu um erro ao carregar o sistema.', e.message);
});

/* ---------- Utilidades ---------- */
function hoje(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function mesSelecionado(){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + state.monthOffset);
  return { ano: d.getFullYear(), mes: d.getMonth() };
}
function rotuloMes(){
  const { ano, mes } = mesSelecionado();
  return new Date(ano, mes, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
}
function fmt(v){
  return (v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function txsDoMes(){
  const { ano, mes } = mesSelecionado();
  return state.txs.filter(t => {
    const [y,m] = t.date.split('-').map(Number);
    return y === ano && (m-1) === mes;
  });
}
function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- Gráfico de pizza ---------- */
function ponto(cx, cy, r, ang){
  const rad = (ang - 90) * Math.PI / 180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}
function fatia(cx, cy, r, ini, fim){
  const a = ponto(cx,cy,r,ini), b = ponto(cx,cy,r,fim);
  const grande = (fim - ini) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${a.x.toFixed(2)} ${a.y.toFixed(2)} A ${r} ${r} 0 ${grande} 1 ${b.x.toFixed(2)} ${b.y.toFixed(2)} Z`;
}

/* ---------- Autenticação (e-mail + senha) ---------- */
function mensagemErro(err){
  const m = err.message || '';
  if (m.includes('Invalid login credentials')) return 'E-mail ou senha incorretos.';
  if (m.includes('User already registered')) return 'Já existe uma conta com esse e-mail. Tente entrar.';
  if (m.includes('Password should be at least')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (m.includes('rate limit') || m.includes('Rate limit')) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  return m;
}

async function entrar(){
  const email = state.email.trim(), senha = state.password;
  if (!email || !senha){ state.statusMsg='Preencha e-mail e senha.'; state.statusErro=true; render(); return; }
  state.busy = true; state.statusMsg=''; render();
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  state.busy = false;
  if (error){ state.statusMsg = mensagemErro(error); state.statusErro = true; render(); }
  // sucesso: onAuthStateChange cuida de carregar os dados
}

async function criarConta(){
  const email = state.email.trim(), senha = state.password;
  if (!email || !senha){ state.statusMsg='Preencha e-mail e senha.'; state.statusErro=true; render(); return; }
  if (senha.length < 6){ state.statusMsg='A senha precisa ter pelo menos 6 caracteres.'; state.statusErro=true; render(); return; }
  if (senha !== state.password2){ state.statusMsg='As senhas não coincidem.'; state.statusErro=true; render(); return; }
  state.busy = true; state.statusMsg=''; render();
  const { data, error } = await sb.auth.signUp({ email, password: senha });
  state.busy = false;
  if (error){
    state.statusMsg = mensagemErro(error); state.statusErro = true;
  }else if (!data.session){
    state.statusMsg = 'Conta criada! Verifique seu e-mail para confirmar antes de entrar.';
    state.statusErro = false;
    state.authMode = 'login';
  }
  // se já vier com sessão (confirmação de e-mail desativada), onAuthStateChange loga direto
  render();
}

async function esqueciSenha(){
  const email = state.email.trim();
  if (!email){ state.statusMsg='Digite seu e-mail acima primeiro.'; state.statusErro=true; render(); return; }
  state.busy = true; render();
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.href.split('#')[0]
  });
  state.busy = false;
  state.statusMsg = error ? mensagemErro(error) : 'Enviamos um link para redefinir sua senha.';
  state.statusErro = !!error;
  render();
}

async function definirNovaSenha(){
  const senha = state.password;
  if (senha.length < 6){ state.statusMsg='A senha precisa ter pelo menos 6 caracteres.'; state.statusErro=true; render(); return; }
  if (senha !== state.password2){ state.statusMsg='As senhas não coincidem.'; state.statusErro=true; render(); return; }
  state.busy = true; render();
  const { error } = await sb.auth.updateUser({ password: senha });
  state.busy = false;
  if (error){ state.statusMsg = mensagemErro(error); state.statusErro = true; render(); return; }
  state.authMode = 'login';
  state.password = ''; state.password2 = '';
  history.replaceState(null, '', window.location.pathname);
  await carregar();
}

async function sair(){
  await sb.auth.signOut();
  state.session = null; state.txs = []; state.statusMsg = ''; state.password = '';
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  render();
}

/* ---------- Dados ---------- */
function salvarCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state.txs)); }catch(e){}
}
function lerCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) state.txs = JSON.parse(raw);
  }catch(e){}
}

async function carregar(){
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  state.loaded = true;
  if (!session){ render(); return; }

  lerCache();
  render();

  const { data, error } = await sb.from('transactions')
    .select('*').order('date', { ascending:false });

  if (error){
    state.statusMsg = 'Sem conexão — mostrando a última cópia salva neste aparelho.';
  }else{
    state.txs = data.map(r => ({
      id:r.id, date:r.date, desc:r.description,
      category:r.category, type:r.type, amount:Number(r.amount)
    }));
    state.statusMsg = '';
    salvarCache();
  }
  render();
}

async function adicionar(){
  const valor = parseFloat(String(state.form.amount).replace(/\./g,'').replace(',','.'));
  if (!valor || valor <= 0 || !state.form.date){
    alert('Preencha a data e um valor válido.');
    return;
  }
  const linha = {
    date: state.form.date,
    description: state.form.desc.trim() || (state.form.type === 'entrada' ? 'Entrada' : 'Saída'),
    category: state.form.category,
    type: state.form.type,
    amount: valor
  };
  state.busy = true; render();
  const { data, error } = await sb.from('transactions').insert(linha).select().single();
  state.busy = false;
  if (error){
    alert('Não foi possível salvar: ' + error.message);
  }else{
    state.txs.push({ id:data.id, date:data.date, desc:data.description,
                     category:data.category, type:data.type, amount:Number(data.amount) });
    state.form.desc = ''; state.form.amount = '';
    salvarCache();
  }
  render();
}

async function excluir(id){
  if (!confirm('Excluir este lançamento?')) return;
  const antes = state.txs;
  state.txs = state.txs.filter(t => t.id !== id);
  render();
  const { error } = await sb.from('transactions').delete().eq('id', id);
  if (error){ alert('Não foi possível excluir: ' + error.message); state.txs = antes; }
  else salvarCache();
  render();
}

/* ---------- Backup ---------- */
function baixarBackup(){
  const blob = new Blob([JSON.stringify(state.txs, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-fluxo-caixa-${hoje()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importarBackup(file){
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const lista = JSON.parse(e.target.result);
      if (!Array.isArray(lista)) throw new Error('formato inválido');
      if (!confirm(`Importar ${lista.length} lançamento(s) para a sua conta?`)) return;
      const linhas = lista.map(t => ({
        date: t.date,
        description: t.desc || t.description || '',
        category: t.category,
        type: t.type,
        amount: t.amount
      }));
      const { error } = await sb.from('transactions').insert(linhas);
      if (error){ alert('Erro ao importar: ' + error.message); return; }
      await carregar();
      alert('Backup importado com sucesso!');
    }catch(err){
      alert('Não foi possível ler esse arquivo. Verifique se é um backup .json deste sistema.');
    }
  };
  reader.readAsText(file);
}

/* ---------- Ações de interface ---------- */
function setTipo(t){ state.form.type = t; state.form.category = CATS[t][0]; render(); }
function mudarMes(d){ state.monthOffset += d; render(); }
function setAba(t){ state.tab = t; render(); }

/* ---------- Render ---------- */
function render(){
  const app = document.getElementById('app');

  if (!state.loaded){
    app.innerHTML = '<div class="empty">Carregando...</div>';
    return;
  }

  if (!state.session || state.authMode === 'recovery'){
    if (state.authMode === 'recovery'){
      app.innerHTML = `
        <div class="login-box">
          <h1>Nova senha</h1>
          <p>Digite a nova senha para sua conta.</p>
          <input type="password" id="pNova" placeholder="Nova senha" autocomplete="new-password" value="${esc(state.password)}">
          <input type="password" id="pNova2" placeholder="Confirme a nova senha" autocomplete="new-password" value="${esc(state.password2)}">
          <button class="add-btn" id="btnSalvarSenha" ${state.busy?'disabled':''}>
            ${state.busy ? 'Salvando...' : 'Salvar nova senha'}
          </button>
          ${state.statusMsg ? `<div class="status-msg${state.statusErro?' erro':''}">${esc(state.statusMsg)}</div>` : ''}
        </div>`;
      document.getElementById('pNova').oninput  = e => state.password = e.target.value;
      document.getElementById('pNova2').oninput = e => state.password2 = e.target.value;
      document.getElementById('btnSalvarSenha').onclick = definirNovaSenha;
      return;
    }

    const cadastro = state.authMode === 'signup';
    app.innerHTML = `
      <div class="login-box">
        <h1>Meu fluxo de caixa</h1>
        <p>${cadastro ? 'Crie sua conta com e-mail e senha.' : 'Entre com seu e-mail e senha.'}</p>
        <input type="email" id="inEmail" placeholder="seu@email.com" autocomplete="email" value="${esc(state.email)}">
        <input type="password" id="inSenha" placeholder="Senha" autocomplete="${cadastro?'new-password':'current-password'}" value="${esc(state.password)}">
        ${cadastro ? `<input type="password" id="inSenha2" placeholder="Confirme a senha" autocomplete="new-password" value="${esc(state.password2)}">` : ''}
        ${!cadastro ? `<div class="login-forgot"><button id="btnEsqueci">Esqueci minha senha</button></div>` : ''}
        <button class="add-btn" id="btnAuth" ${state.busy?'disabled':''}>
          ${state.busy ? 'Aguarde...' : (cadastro ? 'Criar conta' : 'Entrar')}
        </button>
        ${state.statusMsg ? `<div class="status-msg${state.statusErro?' erro':''}">${esc(state.statusMsg)}</div>` : ''}
        <div class="login-switch">
          ${cadastro
            ? `Já tem conta? <button id="btnTrocarModo">Entrar</button>`
            : `Ainda não tem conta? <button id="btnTrocarModo">Criar conta</button>`}
        </div>
      </div>`;

    const inEmail = document.getElementById('inEmail');
    const inSenha = document.getElementById('inSenha');
    inEmail.oninput = e => state.email = e.target.value;
    inSenha.oninput = e => state.password = e.target.value;
    const acao = cadastro ? criarConta : entrar;
    inSenha.onkeydown = e => { if (e.key === 'Enter') acao(); };
    if (cadastro){
      document.getElementById('inSenha2').oninput = e => state.password2 = e.target.value;
    }else{
      document.getElementById('btnEsqueci').onclick = esqueciSenha;
    }
    document.getElementById('btnAuth').onclick = acao;
    document.getElementById('btnTrocarModo').onclick = () => {
      state.authMode = cadastro ? 'login' : 'signup';
      state.statusMsg = ''; state.password2 = '';
      render();
    };
    return;
  }

  const mes = txsDoMes();
  const entradas = mes.filter(t=>t.type==='entrada' && t.category!=='Saldo inicial (investimento)').reduce((s,t)=>s+t.amount,0);
  const saidas  = mes.filter(t=>t.type==='saida').reduce((s,t)=>s+t.amount,0);
  const saldo = entradas - saidas;

  const aplicMes   = mes.filter(t=>t.type==='saida'   && t.category==='Aplicação').reduce((s,t)=>s+t.amount,0);
  const resgateMes = mes.filter(t=>t.type==='entrada' && t.category==='Resgate').reduce((s,t)=>s+t.amount,0);
  const aplicTotal   = state.txs.filter(t=>t.type==='saida'   && t.category==='Aplicação').reduce((s,t)=>s+t.amount,0);
  const resgateTotal = state.txs.filter(t=>t.type==='entrada' && t.category==='Resgate').reduce((s,t)=>s+t.amount,0);
  const saldoInicialInvest = state.txs.filter(t=>t.type==='entrada' && t.category==='Saldo inicial (investimento)').reduce((s,t)=>s+t.amount,0);
  const saldoInvest = aplicTotal - resgateTotal + saldoInicialInvest;

  const porCat = {};
  mes.filter(t=>t.type==='saida').forEach(t => { porCat[t.category] = (porCat[t.category]||0) + t.amount; });
  const lista = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const totalCat = lista.reduce((s,[,v])=>s+v,0);
  let ang = 0;
  const fatias = lista.map(([cat,val],i)=>{
    const graus = totalCat ? (val/totalCat*360) : 0;
    const d = fatia(100,100,90,ang,ang+graus);
    ang += graus;
    return { cat, val, pct: totalCat ? val/totalCat*100 : 0, d, cor: PIE_COLORS[i % PIE_COLORS.length] };
  });

  // Cartão de crédito: gasto do mês + quebra por descrição
  const txsCartao = mes.filter(t=>t.type==='saida' && t.category==='Cartão de crédito');
  const cartaoMes = txsCartao.reduce((s,t)=>s+t.amount,0);
  const porDesc = {};
  txsCartao.forEach(t => {
    const chave = t.desc && t.desc.trim() ? t.desc.trim() : 'Sem descrição';
    porDesc[chave] = (porDesc[chave]||0) + t.amount;
  });
  const listaCartao = Object.entries(porDesc).sort((a,b)=>b[1]-a[1]);
  let angC = 0;
  const fatiasCartao = listaCartao.map(([desc,val],i)=>{
    const graus = cartaoMes ? (val/cartaoMes*360) : 0;
    const d = fatia(100,100,90,angC,angC+graus);
    angC += graus;
    return { desc, val, pct: cartaoMes ? val/cartaoMes*100 : 0, d, cor: PIE_COLORS[i % PIE_COLORS.length] };
  });

  const ordenadas = [...mes].sort((a,b)=> b.date.localeCompare(a.date));

  app.innerHTML = `
    <div class="masthead">
      <h1>Meu fluxo de caixa</h1>
      <div class="month-nav">
        <button id="prevMes">‹</button>
        <span class="month-label">${rotuloMes()}</span>
        <button id="nextMes">›</button>
      </div>
    </div>

    <div class="summary">
      <div class="stat income"><div class="label">Entradas</div><div class="value">${fmt(entradas)}</div></div>
      <div class="stat expense"><div class="label">Saídas</div><div class="value">${fmt(saidas)}</div></div>
      <div class="stat balance">
        <div class="label">Saldo do mês</div>
        <div class="value" style="color:${saldo>=0?'var(--income)':'var(--expense)'}">${fmt(saldo)}</div>
      </div>
      <div class="stat invest">
        <div class="label">Saldo Investimentos</div>
        <div class="value">${fmt(saldoInvest)}</div>
        <div class="sub">Mês: aplicado ${fmt(aplicMes)} · resgatado ${fmt(resgateMes)}</div>
      </div>
      <div class="stat expense">
        <div class="label">Cartão de crédito (mês)</div>
        <div class="value">${fmt(cartaoMes)}</div>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <h2>Novo lançamento</h2>
        <div class="toggle">
          <button class="type-income ${state.form.type==='entrada'?'active':''}" id="tEntrada">Entrada</button>
          <button class="type-expense ${state.form.type==='saida'?'active':''}" id="tSaida">Saída</button>
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="fData" value="${state.form.date}">
        </div>
        <div class="field">
          <label>Categoria</label>
          <select id="fCat">
            ${CATS[state.form.type].map(c=>`<option ${c===state.form.category?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Descrição</label>
          <input type="text" id="fDesc" placeholder="Ex: Mercado, Conta de luz..." value="${esc(state.form.desc)}">
        </div>
        <div class="field">
          <label>Valor (R$)</label>
          <input type="text" inputmode="decimal" id="fValor" placeholder="0,00" value="${esc(state.form.amount)}">
        </div>
        <button class="add-btn" id="addBtn" ${state.busy?'disabled':''}>
          ${state.busy ? 'Salvando...' : 'Adicionar lançamento'}
        </button>
      </div>

      <div class="panel">
        <div class="tabs">
          <button class="tab-btn ${state.tab==='lista'?'active':''}" id="abaLista">Lançamentos</button>
          <button class="tab-btn ${state.tab==='grafico'?'active':''}" id="abaGrafico">Gráfico</button>
          <button class="tab-btn ${state.tab==='cartao'?'active':''}" id="abaCartao">Cartão</button>
        </div>
        ${state.tab==='lista' ? (
          ordenadas.length ? ordenadas.map(t=>`
            <div class="tx-row">
              <div class="tx-date">${t.date.slice(8,10)}/${t.date.slice(5,7)}</div>
              <div class="tx-info">
                <span class="tx-cat">${esc(t.category)}</span>
                <div class="tx-desc">${esc(t.desc)}</div>
              </div>
              <div class="tx-amount ${t.type==='entrada'?'income':'expense'}">
                ${t.type==='entrada'?'+':'-'} ${fmt(t.amount)}
              </div>
              <button class="tx-del" data-id="${t.id}" title="Excluir">✕</button>
            </div>`).join('')
          : '<div class="empty">Nenhum lançamento neste mês ainda.</div>'
        ) : state.tab==='grafico' ? (
          fatias.length ? `
            <div class="pie-wrap">
              <svg viewBox="0 0 200 200" width="190" height="190">
                ${fatias.length===1
                  ? `<circle cx="100" cy="100" r="90" fill="${fatias[0].cor}"></circle>`
                  : fatias.map(f=>`<path d="${f.d}" fill="${f.cor}"><title>${esc(f.cat)}: ${fmt(f.val)}</title></path>`).join('')}
              </svg>
              <div class="pie-legend">
                ${fatias.map(f=>`
                  <div class="legend-row">
                    <span class="swatch" style="background:${f.cor}"></span>
                    <span class="legend-label">${esc(f.cat)}</span>
                    <span class="legend-val">${fmt(f.val)} · ${f.pct.toFixed(0)}%</span>
                  </div>`).join('')}
              </div>
            </div>`
          : '<div class="empty">Nenhum gasto neste mês ainda.<br>O gráfico aparece no primeiro lançamento de saída.</div>'
        ) : (
          fatiasCartao.length ? `
            <div class="sub" style="margin-bottom:12px;">Total no cartão este mês: <strong>${fmt(cartaoMes)}</strong></div>
            <div class="pie-wrap">
              <svg viewBox="0 0 200 200" width="190" height="190">
                ${fatiasCartao.length===1
                  ? `<circle cx="100" cy="100" r="90" fill="${fatiasCartao[0].cor}"></circle>`
                  : fatiasCartao.map(f=>`<path d="${f.d}" fill="${f.cor}"><title>${esc(f.desc)}: ${fmt(f.val)}</title></path>`).join('')}
              </svg>
              <div class="pie-legend">
                ${fatiasCartao.map(f=>`
                  <div class="legend-row">
                    <span class="swatch" style="background:${f.cor}"></span>
                    <span class="legend-label">${esc(f.desc)}</span>
                    <span class="legend-val">${fmt(f.val)} · ${f.pct.toFixed(0)}%</span>
                  </div>`).join('')}
              </div>
            </div>`
          : '<div class="empty">Nenhum gasto no cartão de crédito neste mês ainda.<br>Lance uma saída com categoria "Cartão de crédito" — coloque uma descrição para diferenciar cada compra e ver a divisão aqui.</div>'
        )}
      </div>
    </div>

    <div class="backup-bar">
      <button class="backup-btn" id="btnExportar">⬇ Baixar backup (.json)</button>
      <label class="backup-btn" for="inputImportar">⬆ Importar backup</label>
      <input type="file" id="inputImportar" accept=".json,application/json" style="display:none">
    </div>
    <div class="save-note">
      ${esc(state.statusMsg || 'Salvo na sua conta — acessível de qualquer aparelho.')}<br>
      ${esc(state.session.user.email)} · <button class="logout-btn" id="btnSair">sair</button>
    </div>`;

  document.getElementById('prevMes').onclick = ()=>mudarMes(-1);
  document.getElementById('nextMes').onclick = ()=>mudarMes(1);
  document.getElementById('tEntrada').onclick = ()=>setTipo('entrada');
  document.getElementById('tSaida').onclick = ()=>setTipo('saida');
  document.getElementById('abaLista').onclick = ()=>setAba('lista');
  document.getElementById('abaGrafico').onclick = ()=>setAba('grafico');
  document.getElementById('abaCartao').onclick = ()=>setAba('cartao');
  document.getElementById('addBtn').onclick = adicionar;
  document.getElementById('btnSair').onclick = sair;
  document.getElementById('btnExportar').onclick = baixarBackup;
  document.getElementById('inputImportar').onchange = e => {
    if (e.target.files[0]) importarBackup(e.target.files[0]);
    e.target.value = '';
  };
  document.getElementById('fData').oninput  = e => state.form.date = e.target.value;
  document.getElementById('fDesc').oninput  = e => state.form.desc = e.target.value;
  document.getElementById('fCat').onchange  = e => state.form.category = e.target.value;
  const fv = document.getElementById('fValor');
  fv.oninput = e => state.form.amount = e.target.value;
  fv.onkeydown = e => { if (e.key === 'Enter') adicionar(); };
  document.querySelectorAll('.tx-del').forEach(b => b.onclick = ()=>excluir(b.dataset.id));
}

/* ---------- Inicialização ---------- */
(function iniciar(){
  if (window.location.hash.includes('type=recovery')){
    state.authMode = 'recovery';
  }
  if (!window.supabase || !window.supabase.createClient){
    telaDeErro('A biblioteca do Supabase não carregou.',
      'Verifique sua conexão com a internet e recarregue a página.');
    return;
  }
  if (SUPABASE_URL.includes('COLE_AQUI') || SUPABASE_KEY.includes('COLE_AQUI')){
    telaDeErro('As credenciais do Supabase não foram preenchidas.',
      'Edite o index.html e preencha SUPABASE_URL e SUPABASE_KEY.');
    return;
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }catch(err){
    telaDeErro('Não foi possível conectar ao Supabase.', err.message);
    return;
  }
  sb.auth.onAuthStateChange((_evt, session) => {
    const mudou = (state.session && state.session.user.id) !== (session && session.user.id);
    state.session = session;
    if (mudou) carregar(); else render();
  });
  carregar().catch(err => telaDeErro('Erro ao carregar seus dados.', err.message));
})();
</script>
</body>
</html>
